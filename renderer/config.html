<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
  <title>BrainTwo · Configuración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;1,300&family=Nunito:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/config.css">
</head>
<body>
  <div class="titlebar">
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <span class="app-name">BrainTwo</span>
  </div>

  <div class="nav-tabs">
    <button class="tab" onclick="window.electronAPI.navigate('notes')">← volver</button>
    <span class="nav-title">configuración</span>
  </div>

  <div class="config-body">
    <div class="config-section">
      <div class="section-title">WhatsApp</div>
      <div class="config-row">
        <div class="config-label">
          <span>Nombre del chat de notas</span>
          <span class="config-sub">El chat de WhatsApp donde te mandás mensajes a vos mismo</span>
        </div>
        <input class="config-input" id="target_chat" placeholder="mis notas" />
      </div>
    </div>

    <div class="config-section">
      <div class="section-title">IA — Gemini</div>
      <div class="config-row">
        <div class="config-label">
          <span>API Key</span>
          <span class="config-sub">Obtenela en <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a></span>
        </div>
        <input class="config-input" id="gemini_api_key" type="password" placeholder="AIza..." />
      </div>
      <div class="config-row">
        <div class="config-label">
          <span>Modelo de texto</span>
          <span class="config-sub">Para categorización y respuestas RAG</span>
        </div>
        <input class="config-input" id="gemini_model" placeholder="gemini-1.5-flash" />
      </div>
    </div>

    <div class="config-section">
      <div class="section-title">Sincronización</div>
      <div class="config-row">
        <div class="config-label">
          <span>Sync al iniciar</span>
          <span class="config-sub">Procesar mensajes nuevos al abrir la app</span>
        </div>
        <div class="toggle" id="toggle-sync" onclick="toggleSwitch(this, 'sync_on_start')">
          <div class="toggle-knob"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="save-btn" id="save-btn">guardar cambios</button>
      <span class="save-status" id="save-status"></span>
    </div>
  </div>

  <script src="js/config.js"></script>
</body>
</html>
